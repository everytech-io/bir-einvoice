name: Feature request
description: Something the library or the mock should support.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        **This page is public.** Do not include TINs, customer details, invoice contents, or EIS
        credentials.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The call, field or check you need, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: The API you picture, in Kotlin or Java.
      render: kotlin
  - type: textarea
    id: spec
    attributes:
      label: BIR document
      description: The section of the EIS API Development Guide, the JSON File Format, or the RMC that asks for this.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed TINs, customer details, invoice contents, and EIS credentials
          required: true
