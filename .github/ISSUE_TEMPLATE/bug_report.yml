name: Bug report
description: The library or the mock does something wrong.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. **This page is public.** Do not paste TINs, customer
        details, real invoices, EIS credentials, application keys, signing keys, auth tokens or
        session keys. Use made-up values, or `MockEisServer`, to show the problem.

        Found a security problem? Do not use this form. See the
        [security policy](https://github.com/everytech-io/bir-einvoice/security/policy).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you called, what you got, and the full exception message.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: snippet
    attributes:
      label: Minimal code snippet
      description: The smallest Kotlin or Java code that shows the problem, ideally against MockEisServer.
      render: kotlin
    validations:
      required: true
  - type: input
    id: library-version
    attributes:
      label: Library version
      description: The bir-einvoice version or commit you build against.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Kotlin or Java version
      placeholder: Kotlin 2.1.21 on JDK 21.0.5 (Temurin), Linux
    validations:
      required: true
  - type: input
    id: eis-error-code
    attributes:
      label: EIS error code
      description: The EisException code or per-invoice result code, if there was one.
      placeholder: E04, SYN004, NETWORK
  - type: dropdown
    id: target
    attributes:
      label: Where it happened
      options:
        - MockEisServer
        - BIR sandbox (eis-cert.bir.gov.ph)
        - BIR production
        - Not calling EIS (model, validator or crypto only)
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed TINs, customer details, invoice contents, and EIS credentials
          required: true
