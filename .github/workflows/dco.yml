# Developer Certificate of Origin check, with no third-party app. Every commit in a pull request
# must carry a "Signed-off-by: Name <email>" line (git commit -s). See CONTRIBUTING.md.
name: dco

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Signed-off-by lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          failed=0
          for sha in $(git rev-list --no-merges "$BASE_SHA..$HEAD_SHA"); do
            author_email="$(git log -1 --format='%ae' "$sha")"
            author_name="$(git log -1 --format='%an' "$sha")"
            subject="$(git log -1 --format='%s' "$sha")"
            # Automated dependency updates cannot sign off; a maintainer reviews and merges them.
            case "$author_name" in
              *"[bot]") echo "skip   ${sha:0:7} (bot) $subject"; continue ;;
            esac
            if git log -1 --format='%B' "$sha" | grep -q -i -E "^Signed-off-by: .+ <[^<>]+@[^<>]+>[[:space:]]*$"; then
              echo "ok     ${sha:0:7} $subject"
            else
              echo "::error::Commit ${sha:0:7} by $author_name <$author_email> has no Signed-off-by line: $subject"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            cat <<'MSG'

          Every commit needs a sign-off that certifies the Developer Certificate of Origin
          (https://developercertificate.org). To fix:

            last commit only:      git commit --amend -s --no-edit
            all commits in the PR: git rebase --signoff origin/main
            then:                  git push --force-with-lease

          See CONTRIBUTING.md, "Sign off your commits".
          MSG
            exit 1
          fi
