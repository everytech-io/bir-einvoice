# Builds and tests on every push to main and every pull request: JVM tests, and the Kotlin/Wasm
# common tests on Node.js (Gradle downloads Node). The tests use the mock EIS only; nothing here
# calls the BIR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Fails the build if gradle/wrapper/gradle-wrapper.jar is not an official Gradle wrapper.
      - uses: gradle/actions/wrapper-validation@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle distribution, dependencies and build cache between runs.
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
      - name: Build and test
        run: ./gradlew check --console=plain
      # JitPack runs this task for a tagged release; make sure it keeps working.
      - name: Publish to the local Maven repository
        if: runner.os == 'Linux'
        run: ./gradlew publishToMavenLocal -x check --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports-${{ runner.os }}
          path: |
            **/build/reports/tests/
          if-no-files-found: ignore
