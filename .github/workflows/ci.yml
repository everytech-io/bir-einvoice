# Builds and tests on every push to main and every pull request: JVM tests, and the Kotlin/Wasm
# common tests on Node.js (Gradle downloads Node). The tests use the mock EIS only; nothing here
# calls the BIR.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # Caches the Gradle distribution, dependencies and build cache between runs.
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew check --console=plain
      # JitPack runs this task for a tagged release; make sure it keeps working.
      - name: Publish to the local Maven repository
        if: runner.os == 'Linux'
        run: ./gradlew publishToMavenLocal -x check --console=plain
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ runner.os }}
          path: |
            **/build/reports/tests/
          if-no-files-found: ignore
